<div class="login-page mx-auto">
  <div class="card">
    <div class="card-body">
      <h1 class="h3 mb-1 text-center">
        <i class="bi bi-rocket-takeoff-fill text-primary" aria-hidden="true"></i>
        Mathe-Rakete
      </h1>
      <p class="text-center text-muted-kid mb-4">{{ mode() === 'login' ? 'Schön, dass du wieder da bist!' : 'Leg dein Konto an' }}</p>

      <form (submit)="$event.preventDefault(); submit()">
        <div class="mb-3">
          <label class="form-label fw-bold" for="login-email">E-Mail-Adresse</label>
          <input id="login-email" class="form-control form-control-lg" type="email" autocomplete="email" required
                 [value]="email()" (input)="email.set($any($event.target).value)" placeholder="lena@beispiel.de" />
        </div>
        <div class="mb-4">
          <label class="form-label fw-bold" for="login-password">Passwort</label>
          <input id="login-password" class="form-control form-control-lg" type="password"
                 [autocomplete]="mode() === 'login' ? 'current-password' : 'new-password'" required
                 [attr.minlength]="mode() === 'register' ? minPassword : null"
                 [value]="password()" (input)="password.set($any($event.target).value)" placeholder="Mindestens {{ minPassword }} Zeichen" />
        </div>

        @if (error(); as message) {
          <div class="alert alert-danger" role="alert">{{ message }}</div>
        }

        <button type="submit" class="btn btn-primary btn-lg w-100" [disabled]="busy()">
          @if (busy()) {
            <span class="spinner-border spinner-border-sm me-1" aria-hidden="true"></span>
          }
          {{ mode() === 'login' ? 'Anmelden' : 'Konto erstellen' }}
        </button>
      </form>

      <p class="text-center mt-4 mb-0">
        @if (mode() === 'login') {
          Noch kein Konto?
          <button type="button" class="btn btn-link p-0" (click)="toggleMode()">Jetzt anlegen</button>
        } @else {
          Schon ein Konto?
          <button type="button" class="btn btn-link p-0" (click)="toggleMode()">Anmelden</button>
        }
      </p>
    </div>
  </div>
</div>
